name: Klain
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: app.klain.chat
    MARKETING_VERSION: '0.2.6'
    CURRENT_PROJECT_VERSION: '9'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Klain:
    type: application
    platform: iOS
    sources: [Klain]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: 'Сделать фото для отправки выбранной ИИ-модели'
        INFOPLIST_KEY_CFBundleDisplayName: klain
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
schemes:
  Klain:
    build:
      targets:
        Klain: all
