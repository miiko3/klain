name: Build klain IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version'
        required: false
        default: '0.7.2'
  push:
    branches: [main, 'build/0.6-alpha']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild -project Klain.xcodeproj -scheme Klain -sdk iphoneos \
            -configuration Release -archivePath build/Klain.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO
        # Keep the log on failure so a compile error is diagnosable.
      - name: Save build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            build/**/*.log
            *.log

      - name: Package unsigned IPA
        run: |
          VERSION="${{ github.event.inputs.version || '0.7.2' }}"
          mkdir -p build/package/Payload build/out
          cp -R build/Klain.xcarchive/Products/Applications/Klain.app build/package/Payload/
          cd build/package
          zip -qr ../out/klain-${VERSION}-unsigned.ipa Payload
          cd ../..
          ls -lh build/out/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: klain-ipa
          path: build/out/*.ipa
          if-no-files-found: error

      # Attach the IPA to the v0.6-alpha release so it is directly downloadable.
      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" build/out/*.ipa --clobber --repo "$GITHUB_REPOSITORY"
