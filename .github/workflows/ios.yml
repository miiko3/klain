name: Build klain
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned archive
        run: |
          xcodebuild -project Klain.xcodeproj -scheme Klain -sdk iphoneos -configuration Release -archivePath build/Klain.xcarchive archive CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        run: |
          mkdir -p build/package/Payload
          cp -R build/Klain.xcarchive/Products/Applications/Klain.app build/package/Payload/
          cd build/package
          zip -r ../klain-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: klain-unsigned
          path: build/klain-unsigned.ipa
